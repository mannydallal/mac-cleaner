## READY TO COPY — replace .github/workflows/build.yml with this file's content.
## GitHub blocks Replit from editing workflow files directly, so:
## 1. Open .github/workflows/build.yml in this repo, click the pencil (Edit)
## 2. Replace everything with the content below this header (from "name:" down)
## 3. Commit to main
## 4. Add secrets ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_TOTP_SECRET, ESIGNER_CREDENTIAL_ID under Settings → Secrets and variables → Actions

name: Build Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & package for Mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing secrets found — building signed & notarized DMG"
            npm run build
            npx electron-builder --mac --publish never -c.mac.notarize.teamId="$APPLE_TEAM_ID"
          else
            echo "::warning::Mac signing secrets not set — building UNSIGNED DMG. See SIGNING.md"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run package:mac
          fi

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: release/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build & package for Windows
        id: signing-mode
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
        run: |
          if [ -n "$ESIGNER_USERNAME" ] && [ -n "$ESIGNER_PASSWORD" ] && \
             [ -n "$ESIGNER_TOTP_SECRET" ] && [ -n "$ESIGNER_CREDENTIAL_ID" ]; then
            echo "mode=esigner" >> "$GITHUB_OUTPUT"
            echo "SSL.com eSigner configuration found — packaging before cloud signing"
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npm run package:win
          elif [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "mode=pfx" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found — building signed installer"
            npm run package:win
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing secrets not set — building UNSIGNED installer. See SIGNING.md"
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npm run package:win
          fi

      - name: Sign Windows installer with SSL.com eSigner
        if: steps.signing-mode.outputs.mode == 'esigner'
        # Pinned to SSLcom/esigner-codesign v1.3.2 (immutable SHA) — never point at a mutable ref.
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/release
          output_path: ${{ github.workspace }}/release-signed
          malware_block: false
          environment_name: PROD
          signing_method: v2

      - name: Replace installers with eSigner-signed copies
        if: steps.signing-mode.outputs.mode == 'esigner'
        shell: pwsh
        run: |
          $signedDir = "release-signed"
          $releaseDir = "release"
          $signed = Get-ChildItem -Path $signedDir -Filter *.exe -Recurse
          if ($signed.Count -eq 0) {
            throw "eSigner produced no signed executables in $signedDir"
          }
          foreach ($file in $signed) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $releaseDir $file.Name) -Force
            Write-Host "Replaced with signed copy: $($file.Name)"
          }

      - name: Verify Windows Authenticode signatures
        if: contains(fromJSON('["esigner", "pfx"]'), steps.signing-mode.outputs.mode)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release" -Filter *.exe -Recurse
          if ($files.Count -eq 0) {
            throw "No Windows executables were produced."
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
            Write-Host "Valid signature: $($file.FullName)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 30

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: System Cleaner v${{ github.run_number }}
          body: |
            ## Download
            - **Mac (Apple Silicon M1/M2/M3)**: Download the `arm64.dmg` file → open it → drag System Cleaner to Applications
            - **Mac (Intel)**: Download the `.dmg` file (without arm64) → open it → drag System Cleaner to Applications
            - **Windows**: Download the `.exe` file → run the installer

            > First time on Mac: right-click the app → Open (bypasses the security warning)
            >
            > **Windows**: If SmartScreen still shows a warning after signing, reputation builds over multiple signed releases with a consistent publisher identity.
          files: ./release/*
          draft: false
          prerelease: false
